<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1024px;
      height: 500px;
      overflow: hidden;
      background: linear-gradient(135deg, #09090b 0%, #121214 50%, #082f49 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      position: relative;
    }
    .glow-cyan {
      position: absolute;
      top: -50px;
      right: -50px;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.22) 0%, transparent 70%);
      pointer-events: none;
    }
    .glow-blue {
      position: absolute;
      bottom: -100px;
      left: 100px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.18) 0%, transparent 70%);
      pointer-events: none;
    }
    .container {
      padding: 70px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      position: relative;
      z-index: 10;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 9999px;
      color: #22d3ee;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      width: fit-content;
    }
    .title {
      font-size: 68px;
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1.1;
      margin-top: 15px;
    }
    .title span {
      background: linear-gradient(90deg, #06b6d4, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 23px;
      color: #94a3b8;
      font-weight: 600;
      margin-top: 8px;
    }
    .pills {
      display: flex;
      gap: 14px;
      margin-top: 25px;
    }
    .pill {
      background: #18181b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
    .footer {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="glow-cyan"></div>
  <div class="glow-blue"></div>
  
  <div class="container">
    <div>
      <div class="badge">⚡ GAMIFIED FITNESS RPG</div>
      <h1 class="title">FitQuest <span>PRO</span></h1>
      <p class="subtitle">Rutinas Inteligentes, Sobrecarga Progresiva & Ligas RPG</p>

      <div class="pills">
        <div class="pill">⚡ 100+ Ejercicios & PPL</div>
        <div class="pill">📈 Sobrecarga 1RM & HUD</div>
        <div class="pill">🏆 Ligas & Rangos RPG</div>
        <div class="pill">⌚ Smartwatch & Heart Rate</div>
      </div>
    </div>

    <div class="footer">
      CONVIERTE CADA GOTA DE SUDOR EN EXPERIENCIA Y SUBE DE NIVEL
    </div>
  </div>
</body>
</html>
