<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Ambient glowing circles -->
  <circle cx="850" cy="150" r="220" fill="#06b6d4" opacity="0.12"/>
  <circle cx="150" cy="380" r="180" fill="#3b82f6" opacity="0.10"/>
  <circle cx="500" cy="250" r="300" fill="#06b6d4" opacity="0.05"/>

  <!-- Top Badge -->
  <rect x="80" y="85" width="200" height="38" rx="19" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="180" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#22d3ee" text-anchor="middle" letter-spacing="2">GAMIFIED FITNESS RPG</text>

  <!-- Main Title -->
  <text x="80" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-1">FitQuest <tspan fill="url(#cyanGrad)">PRO</tspan></text>
  
  <!-- Subtitle -->
  <text x="80" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#94a3b8">Rutinas Inteligentes, Sobrecarga Progresiva &amp; Ligas RPG</text>

  <!-- Feature Pills -->
  <g transform="translate(80, 315)">
    <rect x="0" y="0" width="165" height="46" rx="14" fill="#18181b" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="82" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">⚡ 100+ Ejercicios</text>

    <rect x="180" y="0" width="180" height="46" rx="14" fill="#18181b" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="270" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">📈 Sobrecarga 1RM</text>

    <rect x="375" y="0" width="175" height="46" rx="14" fill="#18181b" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="462" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">🏆 Ligas &amp; Rangos</text>

    <rect x="565" y="0" width="155" height="46" rx="14" fill="#18181b" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="642" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">⌚ Smartwatch</text>
  </g>

  <!-- Bottom CTA ribbon -->
  <text x="80" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="url(#goldGrad)" letter-spacing="1">CONVIERTE CADA GOTA DE SUDOR EN EXPERIENCIA Y SUBE DE NIVEL</text>
</svg>
